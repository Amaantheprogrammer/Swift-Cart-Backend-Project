spring:
  application:
    name: E-CommerceBackendProject

  # MySQL Database Configuration
  datasource:
    # url: jdbc:mysql://localhost:3306/ecommerceDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # username: root
    # password: root
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerceDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true  # Format SQL in logs (optional but makes show-sql readable)

  # Redis
  data:
    redis:
      # host: localhost
      # port: 6379
      url: ${REDIS_URL:redis://localhost:6379}
  cache:
    type: redis

# Port
# server.port=5048
server:
  port: ${PORT:8080}

  # server.servlet.context-path=/api/v1

  error:
    include-message: always
    include-exception: true